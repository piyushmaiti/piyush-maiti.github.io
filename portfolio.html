    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0e;
            --bg-card: #111116;
            --accent-gold: #d4a853;
            --accent-gold-dim: rgba(var(--gold-rgb), 0.08);
            --accent-blue: #6fa3d8;
            --text-primary: #e8e6e1;
            --text-secondary: #8a8a8f;
            --text-muted: #7c7c87;
            --border: #1a1a22;
            --border-hover: #2a2a35;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --gold-rgb: 212, 168, 83;
            --hl-rgb: 255, 255, 255;
            --shadow: rgba(0, 0, 0, 0.4);
            --theme-pill-font: var(--font-mono);
            color-scheme: dark;
        }

        /* Day view: the sidebar goes light; the photo viewer stays dark so photos are seen on black */
        :root[data-theme="day"] {
            --bg-primary: #f5f6f8;
            --bg-secondary: #eceef2;
            --bg-card: #ffffff;
            --accent-gold: #8a5f12;
            --accent-blue: #2c659f;
            --text-primary: #17181d;
            --text-secondary: #4b4e58;
            --text-muted: #686c78;
            --border: #e1e4ea;
            --border-hover: #cdd1da;
            --gold-rgb: 138, 95, 18;
            --hl-rgb: 23, 24, 29;
            --shadow: rgba(23, 24, 29, 0.10);
            color-scheme: light;
        }
        :root[data-theme="day"] .viewer {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0e;
            --bg-card: #111116;
            --accent-gold: #d4a853;
            --accent-blue: #6fa3d8;
            --text-primary: #e8e6e1;
            --text-secondary: #8a8a8f;
            --text-muted: #7c7c87;
            --border: #1a1a22;
            --border-hover: #2a2a35;
            --gold-rgb: 212, 168, 83;
            --hl-rgb: 255, 255, 255;
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .portfolio-container {
            display: flex;
            height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 50px 0;
            z-index: 10;
        }

        .sidebar-header {
            padding: 0 32px;
            margin-bottom: 50px;
        }

        .sidebar-name {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .sidebar-name a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .sidebar-name a:hover { color: var(--accent-gold); }

        .sidebar-label {
            font-family: var(--font-mono);
            font-size: 10px;
        }

        .nav-menu {
            flex: 1;
            padding: 0 20px;
        }

        .nav-group-title {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s var(--ease-out);
            margin-bottom: 2px;
            position: relative;
        }

        .nav-item::before {
            content: '';
            width: 3px;
            height: 0;
            background: var(--accent-gold);
            border-radius: 2px;
            position: absolute;
            left: 0;
            transition: height 0.3s var(--ease-out);
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(var(--hl-rgb), 0.02);
        }

        .nav-item:hover::before { height: 16px; }

        .nav-item.active {
            color: var(--accent-gold);
            background: var(--accent-gold-dim);
            font-weight: 500;
        }

        .nav-item.active::before { height: 16px; }

        .nav-count {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .sidebar-footer {
            padding: 0 20px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-copy { font-size: 12px; font-weight: 300; line-height: 1.5; color: var(--text-muted); }


        /* ===== DAY / NIGHT PILL ===== */
        .theme-pill { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 3px; border-radius: 100px; border: 1px solid var(--border-hover); background: var(--bg-card); box-shadow: 0 2px 10px var(--shadow); cursor: pointer; font: inherit; color: inherit; }
        .theme-pill:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 3px; }
        .theme-opt { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px; border-radius: 100px; font-family: var(--theme-pill-font, monospace); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); transition: color 0.4s var(--ease-out); }
        .theme-opt svg { width: 14px; height: 14px; flex: none; }
        .theme-knob { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 100px; background: var(--accent-gold-dim); border: 1px solid var(--accent-gold); transition: transform 0.45s var(--ease-out); }
        :root[data-theme="night"] .theme-knob { transform: translateX(100%); }
        :root[data-theme="day"] .theme-day, :root[data-theme="night"] .theme-night { color: var(--accent-gold); }
        /* smooth colour change only while switching */
        .theme-anim, .theme-anim *, .theme-anim *::before, .theme-anim *::after { transition: background-color 0.5s var(--ease-out), color 0.5s var(--ease-out), border-color 0.5s var(--ease-out), box-shadow 0.5s var(--ease-out) !important; }
        .theme-pill.floating { position: fixed; top: 16px; right: 16px; z-index: 1001; }

        /* ===== VIEWER ===== */
        .viewer {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .viewer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(var(--gold-rgb), 0.02), transparent 70%);
            pointer-events: none;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-image {
            max-width: 88%;
            max-height: 82vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            border-radius: 2px;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
        }

        .main-image.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* ===== LOADING SPINNER ===== */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s var(--ease-out);
            pointer-events: none;
        }

        .loading-spinner.visible {
            opacity: 1;
        }

        .spinner-ring {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(var(--gold-rgb), 0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Nav Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(var(--hl-rgb), 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(var(--hl-rgb), 0.06);
            color: var(--text-secondary);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s var(--ease-out);
            z-index: 5;
        }

        .nav-arrow:hover {
            background: rgba(var(--gold-rgb), 0.08);
            border-color: rgba(var(--gold-rgb), 0.2);
            color: var(--accent-gold);
            transform: translateY(-50%) scale(1.08);
        }

        .nav-arrow.prev { left: 30px; }
        .nav-arrow.next { right: 30px; }

        /* Caption Bar */
        .caption-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(5, 5, 7, 0.95), rgba(5, 5, 7, 0.6) 60%, transparent);
            padding: 60px 50px 30px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
        }

        .caption-text {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            color: var(--text-primary);
            opacity: 0.9;
            letter-spacing: 0.3px;
        }

        .image-counter {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Progress bar */
        .progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(var(--hl-rgb), 0.04);
            z-index: 6;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            transition: width 0.4s var(--ease-out);
            opacity: 0.6;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state p {
            font-family: var(--font-display);
            font-size: 20px;
            font-style: italic;
            opacity: 0.5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .portfolio-container { flex-direction: column; }

            .sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 20px 0 16px;
                flex-direction: column;
                height: auto;
                overflow: visible;
            }

            .sidebar-header { padding: 0 20px; margin-bottom: 16px; }
            .sidebar-name { font-size: 20px; }

            .nav-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0 16px;
                overflow-x: auto;
            }

            .nav-group-title { display: none; }

            .nav-item {
                padding: 6px 14px;
                font-size: 12px;
                white-space: nowrap;
                border-radius: 100px;
                margin-bottom: 0;
            }

            .nav-item::before { display: none; }
            .nav-count { display: none; }

            .sidebar-footer { border-top: 0; padding: 12px 20px 0; }

            .nav-arrow { width: 44px; height: 44px; }
            .nav-arrow.prev { left: 12px; }
            .nav-arrow.next { right: 12px; }

            .caption-bar { padding: 40px 20px 20px; }
            .caption-text { font-size: 15px; }
        }

        /* Respect users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    
        /* ===== MOTION ===== */
        /* Pages cross-fade into each other (browsers without support just navigate normally) */
        @view-transition { navigation: auto; }
        /* Day/night switch: the new theme grows out of the pill in a circle (see the toggle script) */
        html.theme-vt::view-transition-old(root), html.theme-vt::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
        @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
    </style>
</head>

    <script>
        // Disable right-click & drag
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
        document.addEventListener('keydown', e => { if (e.ctrlKey && (e.keyCode === 83 || e.keyCode === 65)) e.preventDefault(); });

        // ===== CAPTIONS =====
        const CAPTIONS = {
            "IMG_3362-Enhanced-NR-Edit.jpg": "San Francisco Fleet Week",
            "IMG_1116.JPG": "Sacramento Street, San Francisco",
            "DSC01738.jpg": "Golden Gate Bridge, San Francisco",
            "DSC09746.jpg": "San Francisco Skyline",
            "19938321413_80d6859877_o.jpg": "Leaves, Black & White",
            "DSC02852-Enhanced-NR-Edit.jpg": "Lake Manzanita, Lassen Volcanic National Park",
            "IMG_4659.jpg": "Trillium Lake, Mt. Hood, Oregon",
            "IMG_4721.jpg": "Trillium Lake, Mt. Hood, Oregon",
            "Yosemite-2024-04-11-09-21-59.jpg": "Yosemite National Park, California",
            "IMG_9320.JPG": "Yosemite National Park, California",
            "_DSC4162.jpg": "Yellowstone National Park, Wyoming",
            "_DSC4179.jpg": "Yellowstone National Park, Wyoming",
            "_DSC4180.jpg": "Yellowstone National Park, Wyoming"
        };

        // ===== IMAGE DATA =====
        const IMAGE_FOLDERS = {
            'portfolio': 'images/portfolio/',
            'landscape': 'images/landscape/',
            'cityscape': 'images/cityscape/',
            'street': 'images/street/',
            'random': 'images/random/',
            'old': 'images/old/'
        };

        const IMAGE_FILES = {
            'portfolio': ['IMG_4659.jpg', 'IMG_4721.jpg'],
            'landscape': ['IMG_4659.jpg', 'IMG_4721.jpg', '_DSC4162.jpg','_DSC4179.jpg', '_DSC4180.jpg'],
            'cityscape': ['DSC09746.jpg', 'DSC01738.jpg', 'IMG_1116.JPG', 'IMG_3362-Enhanced-NR-Edit.jpg'],
            'street': ['DSC00460-Edit.jpg', 'DSC00486-Edit.jpg', 'DSC00526.jpg', 'DSC00552.jpg', 'DSC00559.jpg', 'DSC00633-Edit.jpg', 'DSC00665.jpg', 'DSC00749.jpg', 'DSC01811.jpg', 'IMG_1408.jpg', 'IMG_9632-Edit.jpg', 'SEATTLE_dtla.jpg', 'SEATTLE_dtla_1.jpg'],
            'random': ['Yosemite-2024-04-11-09-21-59.jpg', 'IMG_9320.JPG', '19938321413_80d6859877_o.jpg'],
            'old': ['12317892_1503793203248746_463737454_n_17851604794052871.jpg', '1a127b005d3bc235756d89a1ad69157f.jpg', '26331587_1785814645057532_5353868040897298432_n_17908286932119447.jpg', '35f125adf230c58dd9eb4f8cb787cecd.jpg', '6b8a93db46d58f3dd4ec70853957c792.jpg', '6c2eae5a08cd97266a52e715dd22571b.jpg', '6fc3a608a0f25b13e63546250a638ead.jpg', '8d9e16707acba6726329592f6c40b088.jpg', 'c039b914dbc80c84fce464cd6321d4b5.jpg', 'c702c50530a1b3dd2104bc8350ee640b.jpg', 'c9c060afd288ee8bcd6cfe6414538e12.jpg', 'dc291aee9b5ed1a2517962c311bace2c.jpg', 'e30f086c75ea42198a764d32bbae60a5.jpg', 'e6a378d3e12892a60c11ff168d6f35da.jpg', 'f3a34e065d28178f6a5b1f253b6159c5.jpg', 'f693b293e69e6eea43ada2866642d2dd.jpg']
        };

        // Fallback caption per category, used when a file has no entry in CAPTIONS
        const CATEGORY_LABELS = {
            'portfolio': 'Portfolio',
            'street': 'Street Photography',
            'landscape': 'Landscape',
            'cityscape': 'Cityscape',
            'random': 'Random',
            'old': 'From the Archive'
        };

        let galleryImages = [];
        let currentIndex = 0;
        let currentCategory = 'portfolio';
        let filteredImages = [];
        const preloadCache = {};

        const mainImage = document.getElementById('mainImage');
        const captionText = document.getElementById('captionText');
        const imageCounter = document.getElementById('imageCounter');
        const progressFill = document.getElementById('progressFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const navItems = document.querySelectorAll('.nav-item');
        const loadingSpinner = document.getElementById('loadingSpinner');

        function buildGallery() {
            galleryImages = [];
            for (const [category, folderPath] of Object.entries(IMAGE_FOLDERS)) {
                const files = IMAGE_FILES[category] || [];
                files.forEach(filename => {
                    let caption = CAPTIONS[filename];
                    if (!caption) {
                        caption = CATEGORY_LABELS[category] || filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    }
                    galleryImages.push({ src: folderPath + filename, caption, category, filename });
                });

                // Update counts
                const countEl = document.getElementById(`count-${category}`);
                if (countEl) countEl.textContent = files.length || '—';
            }
        }

        function filterImages(category) {
            currentCategory = category;
            filteredImages = galleryImages.filter(img => img.category === category);
            currentIndex = 0;
        }

        // Preload the next and previous images in background
        function preloadAdjacent() {
            if (filteredImages.length <= 1) return;
            const nextIdx = (currentIndex + 1) % filteredImages.length;
            const prevIdx = (currentIndex - 1 + filteredImages.length) % filteredImages.length;
            [nextIdx, prevIdx].forEach(idx => {
                const src = filteredImages[idx].src;
                if (!preloadCache[src]) {
                    const img = new Image();
                    img.src = src;
                    preloadCache[src] = img;
                }
            });
        }

        function updateDisplay() {
            if (filteredImages.length === 0) {
                mainImage.src = '';
                mainImage.classList.remove('loaded');
                loadingSpinner.classList.remove('visible');
                captionText.textContent = 'No images in this collection yet';
                imageCounter.textContent = '— / —';
                progressFill.style.width = '0%';
                return;
            }

            const current = filteredImages[currentIndex];

            // Hide current image, show spinner
            mainImage.classList.remove('loaded');
            loadingSpinner.classList.add('visible');

            // Update caption & counter immediately
            captionText.textContent = current.caption;
            imageCounter.textContent = `${currentIndex + 1} / ${filteredImages.length}`;
            progressFill.style.width = `${((currentIndex + 1) / filteredImages.length) * 100}%`;

            // Load image via temp Image to detect when ready
            const tempImg = new Image();

            tempImg.onload = () => {
                mainImage.src = current.src;
                // Double requestAnimationFrame ensures browser has painted the reset
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        mainImage.classList.add('loaded');
                        loadingSpinner.classList.remove('visible');
                        // Preload neighbors after current finishes
                        preloadAdjacent();
                    });
                });
            };

            tempImg.onerror = () => {
                loadingSpinner.classList.remove('visible');
                captionText.textContent = current.caption + ' — failed to load';
            };

            // If already in preloadCache, onload fires nearly instantly
            tempImg.src = current.src;
        }

        function showNext() {
            if (filteredImages.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredImages.length;
            updateDisplay();
        }

        function showPrevious() {
            if (filteredImages.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredImages.length) % filteredImages.length;
            updateDisplay();
        }

        prevBtn.addEventListener('click', showPrevious);
        nextBtn.addEventListener('click', showNext);

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') showNext();
            else if (e.key === 'ArrowLeft') showPrevious();
        });

        navItems.forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault();
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                filterImages(item.dataset.category);
                updateDisplay();
            });
        });

        window.addEventListener('load', () => {
            buildGallery();
            filterImages(currentCategory);
            updateDisplay();
        });
    
        // Day / night toggle (choice is shared by all pages via localStorage 'pm-theme')
        (function () {
            var root = document.documentElement;
            var pills = document.querySelectorAll('.theme-pill');
            function sync() {
                var day = root.getAttribute('data-theme') === 'day';
                pills.forEach(function (p) { p.setAttribute('aria-checked', day ? 'true' : 'false'); });
            }
            pills.forEach(function (p) {
                p.addEventListener('click', function () {
                    var next = root.getAttribute('data-theme') === 'day' ? 'night' : 'day';
                    function apply() {
                        root.setAttribute('data-theme', next);
                        try { localStorage.setItem('pm-theme', next); } catch (e) {}
                        sync();
                    }
                    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    if (document.startViewTransition && !reduce) {
                        // Circular reveal from the centre of the pill
                        var r = p.getBoundingClientRect();
                        var x = r.left + r.width / 2, y = r.top + r.height / 2;
                        var radius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
                        root.classList.add('theme-vt');
                        var started = false;
                        var vt = document.startViewTransition(function () { started = true; apply(); });
                        // Safety net: if the transition doesn't start quickly, switch instantly
                        setTimeout(function () { if (!started) vt.skipTransition(); }, 500);
                        vt.ready.then(function () {
                            root.animate(
                                { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'] },
                                { duration: 1100, easing: 'cubic-bezier(0.45, 0, 0.25, 1)', pseudoElement: '::view-transition-new(root)' }
                            );
                        }).catch(function () {});  // skipped (e.g. another transition started): the theme still switches
                        vt.finished.finally(function () { root.classList.remove('theme-vt'); });
                    } else {
                        root.classList.add('theme-anim');
                        apply();
                        setTimeout(function () { root.classList.remove('theme-anim'); }, 600);
                    }
                });
            });
            sync();
        })();

        document.getElementById('copyright-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
